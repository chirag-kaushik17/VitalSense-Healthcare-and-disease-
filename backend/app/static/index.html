<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitalSense — Patient Risk Explorer</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111c2d;
        --panel-alt: #16253b;
        --muted: #a9b9d1;
        --text: #edf3ff;
        --primary: #5ab4ff;
        --low: #198754;
        --moderate: #d97706;
        --high: #dc2626;
        --border: #2a3d5a;
        --shadow: rgba(0, 0, 0, 0.22);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: linear-gradient(180deg, #0b1220 0%, #0e1729 100%);
        color: var(--text);
        font-family: Segoe UI, Tahoma, sans-serif;
      }
      body {
        min-height: 100vh;
        padding: 18px;
      }
      .app {
        max-width: 1400px;
        margin: 0 auto;
      }
      .header {
        border: 1px solid var(--border);
        background: rgba(17, 28, 45, 0.96);
        border-radius: 14px;
        padding: 14px 18px;
        box-shadow: 0 8px 28px var(--shadow);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 2vw, 2.8rem);
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin-top: 8px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
        gap: 18px;
        margin-top: 18px;
      }
      .panel {
        background: rgba(17, 28, 45, 0.96);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 28px var(--shadow);
      }
      .sidebar {
        padding: 16px;
      }
      .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin: 12px 0 16px;
      }
      button {
        border: 1px solid var(--border);
        background: #1a2d46;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.15s ease;
      }
      button:hover { background: #21406c; }
      .filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .filter-row input {
        flex: 1;
        background: #0d1726;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
      }
      .pagination {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 12px;
      }
      .pager-button {
        flex: 1;
      }
      .patient-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 62vh;
        overflow: auto;
      }
      .patient-item {
        border: 1px solid var(--border);
        background: var(--panel-alt);
        border-radius: 10px;
        padding: 12px 12px;
        cursor: pointer;
        text-align: left;
        width: 100%;
      }
      .patient-item.active {
        border-color: var(--primary);
        box-shadow: inset 0 0 0 1px var(--primary);
      }
      .patient-item small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }
      .main-panel {
        padding: 20px;
      }
      .loading, .error, .empty {
        padding: 18px;
        border-radius: 10px;
        margin: 8px 0;
        border: 1px solid var(--border);
      }
      .loading { background: rgba(90,180,255,0.08); }
      .error { background: rgba(220,38,38,0.11); color: #ffd3d3; }
      .empty { background: rgba(167, 139, 250, 0.06); color: var(--muted); }
      .risk-header {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 22px;
      }
      .risk-score {
        font-size: clamp(2.2rem, 4vw, 4.2rem);
        font-weight: 700;
        line-height: 1;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 8px 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .badge.low { background: rgba(25, 135, 84, 0.18); color: #aaf3d4; border: 1px solid rgba(25,135,84,0.75); }
      .badge.moderate { background: rgba(217, 119, 6, 0.18); color: #f7d39b; border: 1px solid rgba(217,119,6,0.8); }
      .badge.high { background: rgba(220,38,38,0.18); color: #ffc4c4; border: 1px solid rgba(220,38,38,0.8); }
      .risk-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .card {
        border: 1px solid var(--border);
        background: rgba(22, 37, 59, 0.9);
        border-radius: 12px;
        padding: 16px;
      }
      .card h3 {
        margin: 0 0 12px 0;
        font-size: 1.25rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid var(--border);
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.9rem;
      }
      tbody tr:hover { background: rgba(255,255,255,0.02); }
      .neighbor-button {
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        padding: 0;
        color: var(--text);
        font-weight: 600;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }
      .stat {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat-label {
        color: var(--muted);
        display: block;
        font-size: 0.82rem;
        margin-bottom: 6px;
      }
      .pill {
        display: inline-block;
        background: rgba(90,180,255,0.12);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 9px;
        margin: 0 6px 6px 0;
      }
      @media (max-width: 980px) {
        .layout { grid-template-columns: 1fr; }
        .risk-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>VitalSense — Patient Risk Explorer</h1>
        <div class="subtitle">Phase 1: similarity-based baseline on synthetic Synthea data.</div>
      </header>

      <div class="layout">
        <aside class="panel sidebar">
          <div class="quick-actions">
            <button id="lowExampleButton" type="button">Low example</button>
            <button id="moderateExampleButton" type="button">Moderate example</button>
            <button id="highExampleButton" type="button">High example</button>
          </div>

          <div class="filter-row">
            <input id="patientFilter" type="text" placeholder="Filter by MRN or sex" aria-label="Filter patients" />
          </div>

          <div id="patientListContainer"></div>

          <div class="pagination">
            <button id="prevPageButton" class="pager-button" type="button">Previous</button>
            <button id="nextPageButton" class="pager-button" type="button">Next</button>
          </div>
        </aside>

        <main class="panel main-panel">
          <div id="statusMessage" class="empty">Select a patient to view their risk summary.</div>
          <div id="patientDetails"></div>
        </main>
      </div>
    </div>

    <script>
      const state = {
        page: 0,
        patients: [],
        patientMap: new Map(),
        filterText: '',
        examples: { low: null, moderate: null, high: null },
        selectedId: null,
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function setStatus(message, tone = 'empty') {
        const container = document.getElementById('statusMessage');
        container.className = tone === 'error' ? 'error' : tone === 'loading' ? 'loading' : 'empty';
        container.textContent = message;
      }

      function parseApiError(error) {
        return error && error.message ? error.message : 'Could not reach API';
      }

      async function apiRequest(path) {
        const response = await fetch(path, { headers: { Accept: 'application/json' } });
        if (!response.ok) {
          throw new Error(`Request failed for ${path}: ${response.status}`);
        }
        return response.json();
      }

      function formatValue(value) {
        if (value === null || value === undefined || value === '') return '—';
        if (typeof value === 'number') return Number.isInteger(value) ? value.toString() : value.toFixed(2);
        return String(value);
      }

      function buildBadge(category) {
        const safe = String(category || 'low').toLowerCase();
        const label = safe.charAt(0).toUpperCase() + safe.slice(1);
        return `<span class="badge ${safe}">${escapeHtml(label)}</span>`;
      }

      async function loadExamples() {
        try {
          const examples = await apiRequest('/demo/examples');
          state.examples = examples || { low: null, moderate: null, high: null };
          document.getElementById('lowExampleButton').disabled = !state.examples.low;
          document.getElementById('moderateExampleButton').disabled = !state.examples.moderate;
          document.getElementById('highExampleButton').disabled = !state.examples.high;
        } catch (error) {
          setStatus('Could not reach API', 'error');
        }
      }

      function applyPatientFilter() {
        const q = state.filterText.trim().toLowerCase();
        const filtered = state.patients.filter((patient) => {
          const mrn = String(patient.mrn || '').toLowerCase();
          const sex = String(patient.sex || '').toLowerCase();
          return mrn.includes(q) || sex.includes(q) || q === '';
        });

        const container = document.getElementById('patientListContainer');
        if (!filtered.length) {
          container.innerHTML = '<div class="empty">No patients match this filter.</div>';
          return;
        }

        const items = filtered.map((patient) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'patient-item';
          button.dataset.patientId = patient.id;
          if (state.selectedId && state.selectedId === patient.id) {
            button.classList.add('active');
          }
          button.innerHTML = `
            <div><strong>${escapeHtml(patient.mrn || 'Unknown MRN')}</strong></div>
            <small>Sex: ${escapeHtml(patient.sex || 'Unknown')} · ID: ${escapeHtml(patient.id)}</small>
          `;
          button.addEventListener('click', () => selectPatient(patient.id));
          return button;
        });

        container.innerHTML = '';
        items.forEach((item) => container.appendChild(item));
      }

      async function loadPatients() {
        const offset = state.page * 50;
        try {
          const response = await apiRequest(`/patients?limit=50&offset=${offset}`);
          state.patients = Array.isArray(response) ? response : [];
          state.patientMap.clear();
          state.patients.forEach((patient) => state.patientMap.set(patient.id, patient));
          applyPatientFilter();
        } catch (error) {
          setStatus(parseApiError(error), 'error');
        }
      }

      async function selectPatient(patientId) {
        state.selectedId = patientId;
        applyPatientFilter();
        const details = document.getElementById('patientDetails');
        details.innerHTML = '<div class="loading">Loading patient details…</div>';

        try {
          const [summary, risk] = await Promise.all([
            apiRequest(`/patients/${patientId}/summary`),
            apiRequest(`/patients/${patientId}/risk?k=5`),
          ]);
          renderDetails(summary, risk);
        } catch (error) {
          details.innerHTML = `<div class="error">Could not load patient details.</div>`;
          setStatus(parseApiError(error), 'error');
        }
      }

      function renderDetails(summary, risk) {
        const details = document.getElementById('patientDetails');
        const patientId = summary.id || risk.patient_id;
        const badge = buildBadge(risk.risk_category || 'low');
        const outOfRangeRows = (risk.out_of_range || []).map((item) => {
          const rangeText = item.low !== null && item.high !== null ? `${formatValue(item.low)}–${formatValue(item.high)}` : item.low !== null ? `>= ${formatValue(item.low)}` : item.high !== null ? `<= ${formatValue(item.high)}` : '—';
          return `
            <tr>
              <td>${escapeHtml(item.measure || 'Unknown')}</td>
              <td>${escapeHtml(formatValue(item.value))}</td>
              <td>${escapeHtml(rangeText)}</td>
            </tr>
          `;
        }).join('');

        const neighborRows = (risk.neighbors || []).map((neighbor) => {
          const neighborPatient = state.patientMap.get(neighbor.patient_id);
          const mrn = neighborPatient ? neighborPatient.mrn : 'Unknown';
          const similarity = Number(neighbor.similarity || 0) * 100;
          return `
            <tr>
              <td>
                <button class="neighbor-button" type="button" data-neighbor-id="${escapeHtml(neighbor.patient_id)}">
                  ${escapeHtml(neighbor.patient_id)}<br><small>${escapeHtml(mrn)}</small>
                </button>
              </td>
              <td>${escapeHtml(similarity.toFixed(1))}%</td>
              <td>${escapeHtml(formatValue(neighbor.own_risk))}</td>
              <td>${escapeHtml(neighbor.high_risk ? 'Yes' : 'No')}</td>
            </tr>
          `;
        }).join('');

        const conditions = Array.isArray(summary.active_conditions) ? summary.active_conditions.slice(0, 10) : [];
        const vitals = summary.latest_vitals || {};
        const vitalsHtml = Object.entries(vitals).map(([key, value]) => `
          <div class="stat">
            <span class="stat-label">${escapeHtml(key.replace(/_/g, ' '))}</span>
            <strong>${escapeHtml(formatValue(value))}</strong>
          </div>
        `).join('');

        details.innerHTML = `
          <div class="risk-header">
            <div class="risk-score">${escapeHtml(formatValue(risk.risk_score))}</div>
            ${badge}
          </div>

          <div class="risk-grid">
            <div class="card">
              <h3>Why this score</h3>
              <table>
                <thead>
                  <tr>
                    <th>Measure</th>
                    <th>Value</th>
                    <th>Normal range</th>
                  </tr>
                </thead>
                <tbody>
                  ${outOfRangeRows || '<tr><td colspan="3">No out-of-range measurements recorded.</td></tr>'}
                </tbody>
              </table>
            </div>

            <div class="card">
              <h3>Similar patients</h3>
              <table>
                <thead>
                  <tr>
                    <th>Patient</th>
                    <th>Similarity</th>
                    <th>Own risk</th>
                    <th>High-risk</th>
                  </tr>
                </thead>
                <tbody>
                  ${neighborRows || '<tr><td colspan="4">No similar patients available.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card" style="margin-top: 16px;">
            <h3>Patient summary</h3>
            <div class="summary-grid">
              <div class="stat"><span class="stat-label">MRN</span><strong>${escapeHtml(summary.mrn || '—')}</strong></div>
              <div class="stat"><span class="stat-label">Age</span><strong>${escapeHtml(formatValue(summary.age))}</strong></div>
              <div class="stat"><span class="stat-label">Sex</span><strong>${escapeHtml(summary.sex || '—')}</strong></div>
              <div class="stat"><span class="stat-label">Smoking</span><strong>${escapeHtml(summary.smoking_status || '—')}</strong></div>
              <div class="stat"><span class="stat-label">Ethnicity</span><strong>${escapeHtml(summary.ethnicity || '—')}</strong></div>
              <div class="stat"><span class="stat-label">Patient ID</span><strong>${escapeHtml(patientId)}</strong></div>
            </div>

            <div style="margin-top: 14px;">
              <strong>Active conditions:</strong>
              <div style="margin-top: 8px;">
                ${conditions.length ? conditions.map((condition) => `<span class="pill">${escapeHtml(condition)}</span>`).join('') : '<span class="pill">No active conditions</span>'}
              </div>
            </div>

            <div style="margin-top: 16px;">
              <strong>Latest vitals:</strong>
              <div class="summary-grid" style="margin-top: 8px;">${vitalsHtml || '<div class="empty">No vitals recorded.</div>'}</div>
            </div>
          </div>
        `;

        details.querySelectorAll('[data-neighbor-id]').forEach((button) => {
          button.addEventListener('click', () => selectPatient(button.dataset.neighborId));
        });
      }

      function bindEvents() {
        document.getElementById('patientFilter').addEventListener('input', (event) => {
          state.filterText = event.target.value;
          applyPatientFilter();
        });

        document.getElementById('prevPageButton').addEventListener('click', () => {
          if (state.page > 0) {
            state.page -= 1;
            loadPatients();
          }
        });

        document.getElementById('nextPageButton').addEventListener('click', () => {
          state.page += 1;
          loadPatients();
        });

        document.getElementById('lowExampleButton').addEventListener('click', async () => {
          const patient = state.examples.low;
          if (patient && patient.patient_id) {
            await selectPatient(patient.patient_id);
          }
        });

        document.getElementById('moderateExampleButton').addEventListener('click', async () => {
          const patient = state.examples.moderate;
          if (patient && patient.patient_id) {
            await selectPatient(patient.patient_id);
          }
        });

        document.getElementById('highExampleButton').addEventListener('click', async () => {
          const patient = state.examples.high;
          if (patient && patient.patient_id) {
            await selectPatient(patient.patient_id);
          }
        });
      }

      async function init() {
        bindEvents();
        await loadExamples();
        await loadPatients();
        const example = state.examples.high || state.examples.moderate || state.examples.low;
        if (example && example.patient_id) {
          await selectPatient(example.patient_id);
        }
      }

      init().catch((error) => {
        setStatus(parseApiError(error), 'error');
      });
    </script>
  </body>
</html>
